name: Test

on:
  pull_request:

jobs:
  node:
    name: Node unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile
        run: npm run lint -w apps/mobile

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Unit tests (mobile)
        run: npm test -w apps/mobile

      - name: Unit tests (shared)
        run: npm test -w packages/shared

      - name: Build web
        run: npm run build -w apps/web

  supabase:
    name: Supabase integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Run integration tests
        run: deno task test

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
