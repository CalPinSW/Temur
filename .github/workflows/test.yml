name: Test

on:
  pull_request:

jobs:
  node:
    name: Node unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile
        run: npm run lint -w apps/mobile

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Unit tests (mobile)
        run: npm test -w apps/mobile

      - name: Unit tests (shared)
        run: npm test -w packages/shared

      - name: Unit tests (web)
        run: npm test -w apps/web

      - name: Build web
        run: npm run build -w apps/web

  e2e:
    name: Web E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned (not "latest"): older CLI versions issue ES256-signed local
      # JWTs that their own bundled edge-runtime can't verify, breaking every
      # authenticated Edge Function call (`{"msg":"Invalid JWT"}` at the
      # gateway) — see the README's "Invalid JWT" troubleshooting note.
      # A prior pin to 2.72.7 worked around a *different* bug (a newer
      # Postgres bootstrap image not granting `authenticated` default
      # privileges), now fixed at the schema level by
      # supabase/migrations/20260823000000_restore_default_schema_grants.sql
      # regardless of CLI/bootstrap-image version. Bump deliberately,
      # verifying both grants and authenticated Edge Function calls survive
      # a fresh `supabase db reset`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Point apps/web at the local Supabase stack
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r .PUBLISHABLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > apps/web/.env.local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: npm run test:e2e -w apps/web
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  supabase:
    name: Supabase integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Kept in sync with the e2e job's pin above — see the comment there.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # EDGE_FUNCTION_SECRET must exist before `supabase start` — the local
      # edge runtime reads supabase/.env (via [edge_runtime.secrets] in
      # config.toml) at boot, not on later writes. A fixed test-only value;
      # nothing here needs to match any real secret.
      - name: Configure edge function test secret
        run: echo "EDGE_FUNCTION_SECRET=ci-test-secret" > .env

      - name: Start local Supabase stack
        run: supabase start

      # supabase/tests/*.test.ts read these directly (separately from what
      # the edge function runtime itself gets via config.toml) to create
      # real signed-in test users and call functions authenticated — without
      # them, every test needing a real session silently no-ops instead of
      # asserting anything.
      - name: Run integration tests
        run: |
          STATUS=$(supabase status -o json)
          export SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)
          export SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)
          export EDGE_FUNCTION_SECRET=ci-test-secret
          deno task test

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
